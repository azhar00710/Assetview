const getPnidSystems=(pid)=>PNID_SYSTEM.filter(r=>r.pnidId===pid).map(r=>({...SYSTEMS.find(s=>s.id===r.systemId),isPrimary:r.isPrimary})).filter(Boolean);
const getLinePnids=(lid)=>PNID_LINE.filter(r=>r.lineId===lid).map(r=>PNIDS.find(p=>p.id===r.pnidId)?.name.split("-D-")[1]).filter(Boolean);

// ═══ APP ═══
const AssetView = function AssetView(){
  const [platform,setPlatform]=useState("p1");
  const [selSys,setSelSys]=useState(null);
  const [selPnid,setSelPnid]=useState(null);
  const [selLine,setSelLine]=useState(null);
  const [selItem,setSelItem]=useState(null);
  const [showXref,setShowXref]=useState(true);
  const [search,setSearch]=useState("");
  // REGISTER MODE: null = miller columns, "systems"|"pnids"|"lines"|"equipment"|"instruments" = focused register
  const [register,setRegister]=useState(null);
  const [regSort,setRegSort]=useState({col:null,asc:true});
  const [regFilter,setRegFilter]=useState({});

  const platSystems=useMemo(()=>SYSTEMS.filter(s=>s.platformId===platform),[platform]);
  const platSysIds=useMemo(()=>platSystems.map(s=>s.id),[platSystems]);

  // All items for platform (used for registers)
  const allPnids=useMemo(()=>{
    const rels=PNID_SYSTEM.filter(r=>platSysIds.includes(r.systemId)&&r.isPrimary);
    const ids=[...new Set(rels.map(r=>r.pnidId))];
    return ids.map(id=>{const p=PNIDS.find(pn=>pn.id===id);const sys=getPnidSystems(id);return p?{...p,primarySystem:sys.find(s=>s.isPrimary)?.code||"",systems:sys.map(s=>s.code).join(", "),systemCount:sys.length}:null}).filter(Boolean);
  },[platSysIds]);
  const allLines=useMemo(()=>LINES.filter(l=>platSysIds.includes(l.systemId)).map(l=>({...l,systemCode:getSysName(l.systemId),pnids:getLinePnids(l.id).join(", "),pnidCount:getLinePnids(l.id).length})),[platSysIds]);
  const allEquip=useMemo(()=>EQUIPMENT.filter(e=>platSysIds.includes(e.systemId)).map(e=>({...e,systemCode:getSysName(e.systemId),line:e.lineId?LINES.find(l=>l.id===e.lineId)?.name||"":"(standalone)"})),[platSysIds]);
  const allInst=useMemo(()=>INSTRUMENTS.filter(i=>platSysIds.includes(i.systemId)).map(i=>({...i,systemCode:getSysName(i.systemId),lineName:LINES.find(l=>l.id===i.lineId)?.name||""})),[platSysIds]);

  // Cascade filters (same as v3)
  const fSystems=useMemo(()=>{let s=platSystems;if(search){const q=search.toLowerCase();s=s.filter(sy=>sy.name.toLowerCase().includes(q)||sy.code.toLowerCase().includes(q))}return s},[platSystems,search]);
  const fPnids=useMemo(()=>{
    if(selSys){const primary=PNID_SYSTEM.filter(r=>r.systemId===selSys&&r.isPrimary).map(r=>({...PNIDS.find(p=>p.id===r.pnidId),isPrimary:true})).filter(Boolean);const xref=showXref?PNID_SYSTEM.filter(r=>r.systemId===selSys&&!r.isPrimary).map(r=>({...PNIDS.find(p=>p.id===r.pnidId),isPrimary:false})).filter(Boolean):[];return[...primary,...xref]}
    const rels=PNID_SYSTEM.filter(r=>fSystems.map(s=>s.id).includes(r.systemId)&&r.isPrimary);const u=new Map();rels.forEach(r=>{if(!u.has(r.pnidId))u.set(r.pnidId,{...PNIDS.find(p=>p.id===r.pnidId),isPrimary:true})});let res=[...u.values()].filter(Boolean);if(search){const q=search.toLowerCase();res=res.filter(p=>p.name.toLowerCase().includes(q)||p.title.toLowerCase().includes(q))}return res;
  },[selSys,fSystems,showXref,search]);
  const fLines=useMemo(()=>{
    if(selPnid){return PNID_LINE.filter(r=>r.pnidId===selPnid).map(r=>{const l=LINES.find(li=>li.id===r.lineId);return l?{...l,isCont:r.isCont||false,ownerSys:getSys(l.systemId),_xref:selSys?l.systemId!==selSys:false}:null}).filter(Boolean)}
    if(selSys){let lines=LINES.filter(l=>l.systemId===selSys).map(l=>({...l,ownerSys:getSys(l.systemId)}));if(showXref){const pIds=PNID_SYSTEM.filter(r=>r.systemId===selSys&&r.isPrimary).map(r=>r.pnidId);pIds.forEach(pid=>{PNID_LINE.filter(r=>r.pnidId===pid).forEach(r=>{const l=LINES.find(li=>li.id===r.lineId);if(l&&l.systemId!==selSys&&!lines.find(x=>x.id===l.id))lines.push({...l,ownerSys:getSys(l.systemId),_xref:true})})})}return lines}
    return LINES.filter(l=>fSystems.map(s=>s.id).includes(l.systemId)).map(l=>({...l,ownerSys:getSys(l.systemId)}));
  },[selPnid,selSys,fSystems,showXref]);
  const fEquip=useMemo(()=>{
    if(selLine){const onLine=EQUIPMENT.filter(e=>e.lineId===selLine).map(e=>({...e,_loc:"on-line"}));const lineObj=LINES.find(l=>l.id===selLine);const standalone=lineObj?EQUIPMENT.filter(e=>e.systemId===lineObj.systemId&&!e.lineId).map(e=>({...e,_loc:"standalone"})):[];return[...onLine,...standalone]}
    if(selPnid){const lIds=PNID_LINE.filter(r=>r.pnidId===selPnid).map(r=>r.lineId);const sIds=PNID_SYSTEM.filter(r=>r.pnidId===selPnid).map(r=>r.systemId);return[...EQUIPMENT.filter(e=>lIds.includes(e.lineId)).map(e=>({...e,_loc:"on-line"})),...EQUIPMENT.filter(e=>sIds.includes(e.systemId)&&!e.lineId).map(e=>({...e,_loc:"standalone"}))]}
    if(selSys)return EQUIPMENT.filter(e=>e.systemId===selSys).map(e=>({...e,_loc:e.lineId?"on-line":"standalone"}));
    return EQUIPMENT.filter(e=>fSystems.map(s=>s.id).includes(e.systemId));
  },[selLine,selPnid,selSys,fSystems]);
  const fInst=useMemo(()=>{
    if(selLine)return INSTRUMENTS.filter(i=>i.lineId===selLine);
    if(selPnid){const lIds=PNID_LINE.filter(r=>r.pnidId===selPnid).map(r=>r.lineId);return INSTRUMENTS.filter(i=>lIds.includes(i.lineId))}
    if(selSys)return INSTRUMENTS.filter(i=>i.systemId===selSys);
    return INSTRUMENTS.filter(i=>fSystems.map(s=>s.id).includes(i.systemId));
  },[selLine,selPnid,selSys,fSystems]);

  const clickSys=(id)=>{setSelSys(selSys===id?null:id);setSelPnid(null);setSelLine(null);setSelItem(null)};
  const clickPnid=(id)=>{setSelPnid(selPnid===id?null:id);setSelLine(null);setSelItem(null)};
  const clickLine=(id)=>{setSelLine(selLine===id?null:id);setSelItem(null)};
  const exitRegister=()=>{setRegister(null);setRegSort({col:null,asc:true});setRegFilter({})};
  const path=[PLATFORMS.find(p=>p.id===platform)?.code,selSys?getSysName(selSys):null,selPnid?PNIDS.find(p=>p.id===selPnid)?.name.split("-D-")[1]:null,selLine?LINES.find(l=>l.id===selLine)?.name.split("-").slice(0,3).join("-"):null].filter(Boolean);

  // Sort helper
  const sortData=(data,key)=>{if(!regSort.col)return data;return[...data].sort((a,b)=>{const va=(a[regSort.col]||"").toString().toLowerCase();const vb=(b[regSort.col]||"").toString().toLowerCase();return regSort.asc?va.localeCompare(vb):vb.localeCompare(va)})};
  const toggleSort=(col)=>setRegSort(prev=>({col,asc:prev.col===col?!prev.asc:true}));
  const SortIcon=({col})=>regSort.col===col?<span style={{marginLeft:2,fontSize:8}}>{regSort.asc?"▲":"▼"}</span>:null;

  // ═══ REGISTER TABLE VIEW ═══
  const RegisterView=({type})=>{
    const configs={
      pnids:{title:"P&ID Register",color:C.b,cols:[{key:"name",label:"Drawing No.",w:180},{key:"title",label:"Title",w:250},{key:"primarySystem",label:"Primary System",w:100},{key:"rev",label:"Rev",w:40},{key:"status",label:"Status",w:70},{key:"systems",label:"All Systems",w:150},{key:"systemCount",label:"Sys#",w:40}],data:allPnids},
      lines:{title:"Line List Register",color:C.o,cols:[{key:"name",label:"Line Number",w:220},{key:"service",label:"Service",w:150},{key:"size",label:"Size",w:50},{key:"pipeClass",label:"Class",w:80},{key:"material",label:"Material",w:60},{key:"dp",label:"DP (psi)",w:60},{key:"dt",label:"DT (°C)",w:60},{key:"systemCode",label:"System",w:60},{key:"pnids",label:"P&IDs",w:120},{key:"pnidCount",label:"#P&ID",w:40}],data:allLines},
      equipment:{title:"Equipment Register",color:C.g,cols:[{key:"tag",label:"Tag",w:100},{key:"eqType",label:"Type",w:110},{key:"desc",label:"Description",w:150},{key:"systemCode",label:"System",w:60},{key:"criticality",label:"Crit.",w:60},{key:"sil",label:"SIL",w:50},{key:"insp",label:"Insp Group",w:80},{key:"cl",label:"Corr Loop",w:70},{key:"line",label:"Line/Location",w:140}],data:allEquip},
      instruments:{title:"Instrument Index",color:C.b,cols:[{key:"tag",label:"Tag",w:90},{key:"iType",label:"Type",w:90},{key:"desc",label:"Description",w:150},{key:"range",label:"Range",w:100},{key:"scada",label:"SCADA Tag",w:100},{key:"systemCode",label:"System",w:60},{key:"lineName",label:"Line",w:180}],data:allInst},
    };
    const cfg=configs[type];if(!cfg)return null;
    let data=sortData(cfg.data);
    // Apply register filters
    Object.entries(regFilter).forEach(([key,val])=>{if(val){const q=val.toLowerCase();data=data.filter(d=>(d[key]||"").toString().toLowerCase().includes(q))}});

    return(
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"8px 14px",background:`${cfg.color}10`,borderBottom:"1px solid #ffffff08",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{width:4,height:18,borderRadius:2,background:cfg.color}}/>
          <span style={{fontSize:14,fontWeight:700,color:C.w}}>{cfg.title}</span>
          <span style={{fontSize:11,color:C.m}}>{data.length} items on {PLATFORMS.find(p=>p.id===platform)?.code}</span>
          <div style={{flex:1}}/>
          <button onClick={exitRegister} style={{padding:"5px 14px",background:C.c,border:"1px solid #ffffff12",borderRadius:6,color:C.t,fontSize:11,cursor:"pointer"}}>← Back to Columns</button>
        </div>
        {/* Filter row */}
        <div style={{display:"flex",borderBottom:"1px solid #ffffff08",flexShrink:0,background:C.p}}>
          {cfg.cols.map(col=>(
            <div key={col.key} style={{width:col.w,flexShrink:0,padding:"4px 6px"}}>
              <input value={regFilter[col.key]||""} onChange={e=>setRegFilter(p=>({...p,[col.key]:e.target.value}))} placeholder={`Filter...`}
                style={{width:"100%",padding:"3px 6px",background:C.c,border:`1px solid ${regFilter[col.key]?cfg.color+"44":"#ffffff08"}`,borderRadius:4,color:C.t,fontSize:10,outline:"none"}}/>
            </div>
          ))}
        </div>
        {/* Header */}
        <div style={{display:"flex",borderBottom:"1px solid #ffffff12",flexShrink:0,background:`${cfg.color}08`}}>
          {cfg.cols.map(col=>(
            <div key={col.key} onClick={()=>toggleSort(col.key)}
              style={{width:col.w,flexShrink:0,padding:"6px 6px",fontSize:10,fontWeight:700,color:cfg.color,cursor:"pointer",userSelect:"none",display:"flex",alignItems:"center"}}>
              {col.label}<SortIcon col={col.key}/>
            </div>
          ))}
        </div>
        {/* Rows */}
        <div style={{flex:1,overflow:"auto"}}>
          {data.map((row,ri)=>(
            <div key={row.id||ri} style={{display:"flex",borderBottom:"1px solid #ffffff05",background:ri%2===0?"transparent":"#ffffff03",cursor:"pointer"}}
              onClick={()=>setSelItem(row)}
              onMouseEnter={e=>e.currentTarget.style.background=`${cfg.color}08`} onMouseLeave={e=>e.currentTarget.style.background=ri%2===0?"transparent":"#ffffff03"}>
              {cfg.cols.map(col=>{
                const val=(row[col.key]||"").toString();
                let color=C.t;
                if(col.key==="criticality")color=CC[val]||C.t;
                if(col.key==="status")color=STC[val]||C.t;
                if(col.key==="sil"&&val)color="#9B59B6";
                if(col.key==="scada"&&val)color=C.b;
                return(
                  <div key={col.key} style={{width:col.w,flexShrink:0,padding:"6px 6px",fontSize:11,color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={val}>

              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

  // Column
  const Col=({title,count,color,regKey,children})=>(
    <div style={{flex:"1 1 0",minWidth:0,display:"flex",flexDirection:"column",borderRight:"1px solid #ffffff06",overflow:"hidden"}}>
      <div style={{padding:"5px 8px",borderBottom:"1px solid #ffffff08",display:"flex",alignItems:"center",gap:4,flexShrink:0,background:`${color}08`,cursor:"pointer"}}
        onClick={()=>setRegister(regKey)} title={`Click to open ${title} register`}>
        <div style={{width:3,height:14,borderRadius:2,background:color,flexShrink:0}}/>
        <span style={{fontSize:10,fontWeight:700,color,letterSpacing:0.5,flex:1}}>{title}</span>
        <span style={{fontSize:9,color:C.m,background:C.c,padding:"1px 6px",borderRadius:8}}>{count}</span>
        <span style={{fontSize:10,color:C.m,opacity:0.5}} title="Open full register">⤢</span>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"2px 0"}}>{children}</div>
    </div>
  );

  return(
    <div style={{display:"flex",height:"100vh",background:C.bg,fontFamily:"'Inter','Arial',sans-serif",color:C.t,overflow:"hidden"}}>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* TOP BAR */}
        <div style={{display:"flex",alignItems:"center",padding:"6px 12px",background:C.p,borderBottom:"1px solid #ffffff08",gap:8,flexShrink:0}}>
          <div style={{width:24,height:24,borderRadius:6,background:`linear-gradient(135deg,${C.g},${C.b})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:C.w}}>G</div>
          <span style={{fontSize:13,fontWeight:700,color:C.w}}>AssetView</span>
          <span style={{fontSize:8,color:C.g,letterSpacing:1}}>GEOSOFT</span>
          <div style={{width:1,height:18,background:"#ffffff12"}}/>
          {!register&&<div style={{display:"flex",alignItems:"center",gap:3}}>{path.map((p,i)=>(<span key={i} style={{display:"flex",alignItems:"center",gap:3}}>{i>0&&<span style={{color:"#ffffff15",fontSize:9}}>›</span>}<span style={{fontSize:11,color:i===path.length-1?C.g:C.m,fontWeight:i===path.length-1?600:400}}>{p}</span></span>))}</div>}
          {register&&<span style={{fontSize:11,color:C.o,fontWeight:600}}>📋 {register.toUpperCase()} REGISTER</span>}
          <div style={{flex:1}}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{width:160,padding:"5px 10px",background:C.c,border:`1px solid ${search?C.g+"44":"#ffffff12"}`,borderRadius:6,color:C.t,fontSize:11,outline:"none"}}/>
          {search&&<button onClick={()=>setSearch("")} style={{background:`${C.r}22`,border:`1px solid ${C.r}44`,borderRadius:5,color:C.r,fontSize:9,cursor:"pointer",padding:"3px 6px"}}>✕</button>}
          <select value={platform} onChange={e=>{setPlatform(e.target.value);setSelSys(null);setSelPnid(null);setSelLine(null);setSelItem(null);setRegister(null)}} style={{padding:"5px 8px",background:C.c,border:"1px solid #ffffff12",borderRadius:6,color:C.t,fontSize:11,outline:"none"}}>{PLATFORMS.map(p=><option key={p.id} value={p.id}>{p.code}</option>)}</select>
          <button onClick={()=>setShowXref(!showXref)} style={{padding:"4px 8px",background:showXref?`${C.o}18`:C.c,border:`1px solid ${showXref?C.o+"44":"#ffffff12"}`,borderRadius:6,color:showXref?C.o:C.m,fontSize:10,cursor:"pointer"}}>{showXref?"🔗":"🔓"} X-Ref</button>
        </div>

        {/* REGISTER or MILLER */}
        {register?(
          <RegisterView type={register}/>
        ):(
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            {/* SYSTEMS */}
            <Col title="SYSTEMS" count={fSystems.length} color={C.g} regKey="systems">
              {fSystems.map(sys=>{const isSel=selSys===sys.id;const sc=SC[sys.sysType];const pc=PNID_SYSTEM.filter(r=>r.systemId===sys.id&&r.isPrimary).length;const lc=LINES.filter(l=>l.systemId===sys.id).length;const ec=EQUIPMENT.filter(e=>e.systemId===sys.id).length;
                return(<div key={sys.id} onClick={()=>clickSys(sys.id)} style={{padding:"7px 8px",margin:"1px 3px",borderRadius:5,cursor:"pointer",background:isSel?`${sc}15`:"transparent",borderLeft:isSel?`3px solid ${sc}`:"3px solid transparent"}} onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background="#ffffff06"}} onMouseLeave={e=>{e.currentTarget.style.background=isSel?`${sc}15`:"transparent"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:7,height:7,borderRadius:4,background:sc}}/><span style={{fontSize:11.5,fontWeight:isSel?600:400,color:isSel?C.w:C.t,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sys.name}</span></div>
                  <div style={{display:"flex",gap:4,marginTop:3,marginLeft:12}}><span style={{fontSize:8,color:C.b,background:`${C.b}12`,padding:"1px 4px",borderRadius:6}}>{pc} P&ID</span><span style={{fontSize:8,color:C.o,background:`${C.o}12`,padding:"1px 4px",borderRadius:6}}>{lc} line</span><span style={{fontSize:8,color:C.g,background:`${C.g}12`,padding:"1px 4px",borderRadius:6}}>{ec} eq</span></div>
                </div>)})}
            </Col>

            {/* P&IDs */}
            <Col title="P&IDs" count={fPnids.length} color={C.b} regKey="pnids">
              {fPnids.map(pnid=>{const isSel=selPnid===pnid.id;const isXref=pnid.isPrimary===false;const lc=PNID_LINE.filter(r=>r.pnidId===pnid.id).length;const xSys=getPnidSystems(pnid.id).filter(s=>!s.isPrimary).length;
                return(<div key={pnid.id+(isXref?"x":"")} onClick={()=>clickPnid(pnid.id)} style={{padding:"6px 8px",margin:"1px 3px",borderRadius:5,cursor:"pointer",background:isSel?`${C.b}15`:"transparent",borderLeft:isSel?`3px solid ${C.b}`:`3px solid ${isXref?C.o+"44":"transparent"}`,opacity:isXref?0.65:1}} onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background="#ffffff06"}} onMouseLeave={e=>{e.currentTarget.style.background=isSel?`${C.b}15`:"transparent"}}>
                  <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:9}}>{isXref?"↗":"📋"}</span><span style={{fontSize:11,fontWeight:isSel?600:400,color:isSel?C.w:C.t,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pnid.name.split("-D-")[1]||pnid.name}</span><span style={{fontSize:8,padding:"1px 5px",borderRadius:8,background:`${STC[pnid.status]}15`,color:STC[pnid.status]}}>{pnid.status.replace(/_/g," ")}</span></div>
                  <div style={{fontSize:10,color:C.m,marginTop:1,marginLeft:17,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pnid.title}</div>
                  <div style={{display:"flex",gap:4,marginTop:2,marginLeft:17}}><span style={{fontSize:8,color:C.m}}>{lc} lines</span>{isXref&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:`${C.o}20`,color:C.o}}>x-ref</span>}{xSys>0&&!isXref&&<span style={{fontSize:8,color:C.o}}>+{xSys} sys</span>}</div>
                </div>)})}
            </Col>

            {/* LINES */}
            <Col title="LINES" count={fLines.length} color={C.o} regKey="lines">
              {fLines.map(line=>{const isSel=selLine===line.id;const isXref=line._xref;const isCont=line.isCont;const os=line.ownerSys;const eqC=EQUIPMENT.filter(e=>e.lineId===line.id).length;const inC=INSTRUMENTS.filter(i=>i.lineId===line.id).length;const pnidC=getLinePnids(line.id).length;
                return(<div key={line.id+(isXref?"x":"")} onClick={()=>clickLine(line.id)} style={{padding:"6px 8px",margin:"1px 3px",borderRadius:5,cursor:"pointer",background:isSel?`${C.o}15`:"transparent",borderLeft:isSel?`3px solid ${C.o}`:`3px solid ${isXref?SC[os?.sysType]+"44":"transparent"}`,opacity:isXref?0.65:1}} onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background="#ffffff06"}} onMouseLeave={e=>{e.currentTarget.style.background=isSel?`${C.o}15`:"transparent"}}>
                  <div style={{display:"flex",alignItems:"center",gap:3}}>{(isCont||isXref)&&<span style={{fontSize:8}}>{isCont?"↗":"·"}</span>}{isXref&&<span style={{width:5,height:5,borderRadius:3,background:SC[os?.sysType]||C.m}}/>}<span style={{fontSize:10.5,fontFamily:"monospace",fontWeight:isSel?600:400,color:isSel?C.w:C.t,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{line.name}</span></div>
                  <div style={{fontSize:10,color:C.m,marginTop:1}}>{line.service} · {line.size}</div>
                  <div style={{display:"flex",gap:3,marginTop:2,flexWrap:"wrap"}}>{isXref&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:`${SC[os?.sysType]}20`,color:SC[os?.sysType]}}>{os?.code}</span>}{isCont&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:`${C.o}20`,color:C.o}}>cont.</span>}{pnidC>1&&<span style={{fontSize:8,color:C.b}}>{pnidC} P&IDs</span>}{eqC>0&&<span style={{fontSize:8,color:C.g}}>{eqC}eq</span>}{inC>0&&<span style={{fontSize:8,color:C.b}}>{inC}inst</span>}</div>
                </div>)})}
            </Col>

            {/* EQUIPMENT */}
            <Col title="EQUIPMENT" count={fEquip.length} color={C.g} regKey="equipment">
              {fEquip.map(eq=>(<div key={eq.id} onClick={()=>setSelItem(selItem?.id===eq.id?null:eq)} style={{padding:"5px 8px",margin:"1px 3px",borderRadius:5,cursor:"pointer",background:selItem?.id===eq.id?`${C.g}12`:"transparent",borderLeft:selItem?.id===eq.id?`3px solid ${C.g}`:"3px solid transparent"}} onMouseEnter={e=>{if(selItem?.id!==eq.id)e.currentTarget.style.background="#ffffff06"}} onMouseLeave={e=>{e.currentTarget.style.background=selItem?.id===eq.id?`${C.g}12`:"transparent"}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:11,fontWeight:600,color:C.w}}>{eq.tag}</span>{eq.criticality==="high"&&<span style={{width:5,height:5,borderRadius:3,background:C.r}}/>}</div>
                <div style={{fontSize:10,color:C.m}}>{eq.eqType}</div>
                <div style={{display:"flex",gap:3,marginTop:2}}>{eq._loc==="standalone"&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:`${C.o}12`,color:C.o}}>standalone</span>}{eq.sil&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:"#9B59B615",color:"#9B59B6"}}>{eq.sil}</span>}</div>
              </div>))}
            </Col>

            {/* INSTRUMENTS */}
            <Col title="INSTRUMENTS" count={fInst.length} color={C.b} regKey="instruments">
              {fInst.map(inst=>(<div key={inst.id} onClick={()=>setSelItem(selItem?.id===inst.id?null:inst)} style={{padding:"5px 8px",margin:"1px 3px",borderRadius:5,cursor:"pointer",background:selItem?.id===inst.id?`${C.b}12`:"transparent",borderLeft:selItem?.id===inst.id?`3px solid ${C.b}`:"3px solid transparent"}} onMouseEnter={e=>{if(selItem?.id!==inst.id)e.currentTarget.style.background="#ffffff06"}} onMouseLeave={e=>{e.currentTarget.style.background=selItem?.id===inst.id?`${C.b}12`:"transparent"}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:11,fontWeight:600,color:C.w}}>{inst.tag}</span><span style={{fontSize:8,padding:"1px 4px",borderRadius:6,background:`${C.b}12`,color:C.b}}>{inst.iType.replace(/_/g," ")}</span></div>
                <div style={{fontSize:10,color:C.m}}>{inst.desc}</div>
                {inst.scada&&<div style={{fontSize:9,color:C.b,marginTop:1}}>{inst.scada}</div>}
              </div>))}
            </Col>
          </div>
        )}

        {/* DETAIL BAR */}
        {selItem&&(<div style={{padding:"7px 14px",background:C.p,borderTop:"1px solid #ffffff08",display:"flex",alignItems:"center",gap:8,flexShrink:0,flexWrap:"wrap"}}>
          <span style={{fontSize:15,fontWeight:700,color:C.w}}>{selItem.tag||selItem.name}</span>
          {selItem.eqType&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:10,background:`${C.g}20`,color:C.g}}>{selItem.eqType}</span>}
          {selItem.iType&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:10,background:`${C.b}20`,color:C.b}}>{selItem.iType?.replace(/_/g," ")}</span>}
          {selItem.criticality&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:10,background:`${CC[selItem.criticality]}20`,color:CC[selItem.criticality]}}>{selItem.criticality}</span>}
          {selItem.sil&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:10,background:"#9B59B620",color:"#9B59B6"}}>{selItem.sil}</span>}
          {selItem.title&&<span style={{fontSize:11,color:C.m}}>{selItem.title}</span>}
          {selItem.desc&&<span style={{fontSize:11,color:C.m}}>{selItem.desc}</span>}
          {selItem.service&&<span style={{fontSize:11,color:C.m}}>{selItem.service} · {selItem.size}</span>}
          {selItem.insp&&<span style={{fontSize:10,color:C.m}}>Insp:{selItem.insp}</span>}
          {selItem.cl&&<span style={{fontSize:10,color:C.m}}>CL:{selItem.cl}</span>}
          {selItem.range&&<span style={{fontSize:10,color:C.m}}>{selItem.range}</span>}
          {selItem.scada&&<span style={{fontSize:10,color:C.b}}>{selItem.scada}</span>}
          <div style={{flex:1}}/><button onClick={()=>setSelItem(null)} style={{background:"none",border:"1px solid #ffffff12",borderRadius:4,color:C.m,fontSize:10,cursor:"pointer",padding:"3px 6px"}}>✕</button>
        </div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AssetView));
</script></body></html>
